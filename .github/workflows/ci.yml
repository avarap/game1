name: Godot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  gdscript-quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GDScript quality tools
        run: python -m pip install --quiet "gdtoolkit>=4.3,<5"

      - name: Apply canonical formatting
        run: find . -type f -name '*.gd' -not -path './.git/*' -print0 | sort -z | xargs -0 gdformat

      - name: Commit canonical formatting once
        run: |
          if git diff --quiet -- '*.gd'; then
            echo "No formatting migration required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.gd'
          git commit -m "style: format all GDScript"
          git push origin HEAD:${{ github.head_ref }}

      - name: Diagnose remaining lint
        continue-on-error: true
        run: find . -type f -name '*.gd' -not -path './.git/*' -print0 | sort -z | xargs -0 gdlint

  validate-and-test:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import and validate project
        run: godot --headless --path . --editor --quit

      - name: Run main-scene smoke test
        run: godot --headless --path . --quit-after 3

      - name: Run bootstrap tests
        run: timeout 30s godot --headless --path . --script res://tests/run_tests.gd
