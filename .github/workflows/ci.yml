name: Godot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  gdscript-quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GDScript quality tools
        run: python -m pip install --quiet "gdtoolkit>=4.3,<5"

      - name: Discover GDScript files
        run: |
          find . -type f -name '*.gd' -not -path './.git/*' -print | sort
          echo "GDScript files: $(find . -type f -name '*.gd' -not -path './.git/*' | wc -l)"

      - name: Lint all GDScript files
        run: find . -type f -name '*.gd' -not -path './.git/*' -print0 | sort -z | xargs -0 gdlint

      - name: Apply canonical formatting once
        run: |
          find . -type f -name '*.gd' -not -path './.git/*' -print0 | sort -z | xargs -0 gdformat
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.gd'
            git commit -m "style: apply canonical gdformat"
            git push origin HEAD:${{ github.head_ref }}
          fi

  validate-and-test:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import and validate project
        run: godot --headless --path . --editor --quit

      - name: Run main-scene smoke test
        run: godot --headless --path . --quit-after 3

      - name: Run bootstrap tests
        run: timeout 30s godot --headless --path . --script res://tests/run_tests.gd
