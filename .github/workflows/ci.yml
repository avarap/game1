name: Godot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gdscript-quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GDScript quality tools
        run: python -m pip install --quiet "gdtoolkit>=4.3,<5"

      - name: Discover GDScript files
        run: |
          find . -type f -name '*.gd' -not -path './.git/*' -print | sort
          echo "GDScript files: $(find . -type f -name '*.gd' -not -path './.git/*' | wc -l)"

      - name: Lint all GDScript files
        run: find . -type f -name '*.gd' -not -path './.git/*' -print0 | sort -z | xargs -0 gdlint

      - name: Format changed GDScript files for diagnostics
        run: |
          gdformat \
            tests/run_tests.gd \
            tests/test_isoverse_test_map.gd \
            world/maps/isoverse_test/isoverse_test_map.gd
          mkdir -p /tmp/gdformat-output/tests
          mkdir -p /tmp/gdformat-output/world/maps/isoverse_test
          cp tests/run_tests.gd /tmp/gdformat-output/tests/
          cp tests/test_isoverse_test_map.gd /tmp/gdformat-output/tests/
          cp world/maps/isoverse_test/isoverse_test_map.gd \
            /tmp/gdformat-output/world/maps/isoverse_test/

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: gdformat-all-changed
          path: /tmp/gdformat-output

      - name: Check formatting of all GDScript files
        run: find . -type f -name '*.gd' -not -path './.git/*' -print0 | sort -z | xargs -0 gdformat --check

  validate-and-test:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import and validate project
        run: godot --headless --path . --editor --quit

      - name: Run main-scene smoke test
        run: godot --headless --path . --quit-after 3

      - name: Run bootstrap tests
        run: timeout 30s godot --headless --path . --script res://tests/run_tests.gd
