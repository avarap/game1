name: Godot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gdscript-quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GDScript quality tools
        run: python -m pip install --quiet "gdtoolkit>=4.3,<5"

      - name: Lint hardened gameplay scripts
        run: |
          gdlint \
            player/player.gd \
            core/components/resource_source_component.gd \
            systems/storage/storage_provider.gd \
            systems/cemetery/cemetery_service.gd \
            systems/simulation/day_night_math.gd \
            systems/simulation/npc_data.gd \
            systems/simulation/npc_navigation_math.gd \
            systems/simulation/npc_state_machine.gd \
            systems/simulation/schedule_entry_data.gd \
            systems/simulation/schedule_data.gd \
            systems/localization/localization_service.gd \
            systems/dialogue/dialogue_condition_data.gd \
            systems/dialogue/dialogue_option_data.gd \
            systems/dialogue/dialogue_node_data.gd \
            systems/dialogue/dialogue_data.gd \
            systems/dialogue/dialogue_service.gd \
            world/storage/storage_chest.gd \
            world/buildings/crafting_station.gd \
            world/cemetery/cemetery_controller.gd \
            world/cemetery/cemetery_action.gd \
            world/interactables/sleep_spot.gd \
            world/interactables/dialogue_interactable.gd \
            world/simulation/day_night_controller.gd \
            world/navigation/world_navigation_region.gd \
            world/npcs/npc_controller.gd \
            ui/dialogue/dialogue_controller.gd \
            tests/test_day_night_cycle.gd \
            tests/test_npc_navigation.gd \
            tests/test_npc_routines.gd \
            tests/test_simulation_acceptance.gd \
            tests/test_dialogue_foundation.gd \
            tests/test_dialogue_gameplay.gd \
            tests/run_tests.gd

      - name: Check formatting of hardened gameplay scripts
        run: |
          gdformat --check \
            player/player.gd \
            core/components/resource_source_component.gd \
            systems/storage/storage_provider.gd \
            systems/cemetery/cemetery_service.gd \
            systems/simulation/day_night_math.gd \
            systems/simulation/npc_data.gd \
            systems/simulation/npc_navigation_math.gd \
            systems/simulation/npc_state_machine.gd \
            systems/simulation/schedule_entry_data.gd \
            systems/simulation/schedule_data.gd \
            systems/localization/localization_service.gd \
            systems/dialogue/dialogue_condition_data.gd \
            systems/dialogue/dialogue_option_data.gd \
            systems/dialogue/dialogue_node_data.gd \
            systems/dialogue/dialogue_data.gd \
            systems/dialogue/dialogue_service.gd \
            world/storage/storage_chest.gd \
            world/buildings/crafting_station.gd \
            world/cemetery/cemetery_controller.gd \
            world/cemetery/cemetery_action.gd \
            world/interactables/sleep_spot.gd \
            world/interactables/dialogue_interactable.gd \
            world/simulation/day_night_controller.gd \
            world/navigation/world_navigation_region.gd \
            world/npcs/npc_controller.gd \
            ui/dialogue/dialogue_controller.gd \
            tests/test_day_night_cycle.gd \
            tests/test_npc_navigation.gd \
            tests/test_npc_routines.gd \
            tests/test_simulation_acceptance.gd \
            tests/test_dialogue_foundation.gd \
            tests/test_dialogue_gameplay.gd \
            tests/run_tests.gd

  validate-and-test:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import and validate project
        run: godot --headless --path . --editor --quit

      - name: Run main-scene smoke test
        run: godot --headless --path . --quit-after 3

      - name: Run bootstrap tests
        run: timeout 30s godot --headless --path . --script res://tests/run_tests.gd
