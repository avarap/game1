name: Godot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gdscript-quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GDScript quality tools
        run: python -m pip install --quiet "gdtoolkit>=4.3,<5"

      - name: Discover GDScript files
        run: |
          find . -type f -name '*.gd' -not -path './.git/*' -print | sort
          echo "GDScript files: $(find . -type f -name '*.gd' -not -path './.git/*' | wc -l)"

      - name: Diagnose lint across all GDScript files
        continue-on-error: true
        run: find . -type f -name '*.gd' -not -path './.git/*' -print0 | sort -z | xargs -0 gdlint

      - name: Apply canonical formatting in runner
        run: find . -type f -name '*.gd' -not -path './.git/*' -print0 | sort -z | xargs -0 gdformat

      - name: Archive formatted GDScript tree
        run: tar -czf /tmp/formatted-gdscript.tar.gz --files-from <(find . -type f -name '*.gd' -not -path './.git/*' -print | sort)

      - name: Upload formatted GDScript tree
        uses: actions/upload-artifact@v4
        with:
          name: formatted-gdscript
          path: /tmp/formatted-gdscript.tar.gz
          retention-days: 1

      - name: Prove migration is required
        run: git diff --exit-code -- '*.gd'

  validate-and-test:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import and validate project
        run: godot --headless --path . --editor --quit

      - name: Run main-scene smoke test
        run: godot --headless --path . --quit-after 3

      - name: Run bootstrap tests
        run: timeout 30s godot --headless --path . --script res://tests/run_tests.gd
