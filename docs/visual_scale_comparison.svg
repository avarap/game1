<g font-family="monospace" font-size="13" fill="#C9BE9B">
<text x="40" y="548">PIPELINE DECISION</text>
<text x="40" y="572">• hero/key NPC: 64×96 native frame target; secondary NPC may prove 48×72 acceptable</text>
<text x="40" y="594">• keep feet pivot + gameplay collision independent from visible sprite size</text>
<text x="40" y="616">• author buildings/trees/hero props at higher native density; do not upscale placeholder art</text>
<text x="40" y="638">• preserve logical navigation grid first; migrate visual families incrementally</text>
<text x="40" y="660">• validate camera at 1.0 / 1.25 / 1.5 with #96 deterministic in-game captures</text>
<text x="40" y="682">• final acceptance is perceptual comparison against docs screenshots, not CI alone</text>
</g>
