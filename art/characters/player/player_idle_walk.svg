<svg xmlns="http://www.w3.org/2000/svg" width="160" height="384" viewBox="0 0 160 384" shape-rendering="crispEdges">
<!-- Original Valdeniebla player atlas: 5 columns (idle + 4 walk), 8 rows (N,NE,E,SE,S,SW,W,NW). -->
<defs>
<g id="p"><rect x="8" y="43" width="16" height="3" fill="#30312D" opacity=".5"/><rect x="10" y="34" width="5" height="9" fill="#4A3B32"/><rect x="17" y="34" width="5" height="9" fill="#4A3B32"/><rect x="8" y="17" width="16" height="20" fill="#24231F"/><rect x="10" y="18" width="12" height="18" fill="#566B45"/><rect x="11" y="25" width="10" height="3" fill="#715845"/><rect x="10" y="6" width="12" height="12" fill="#24231F"/><rect x="11" y="7" width="10" height="10" fill="#C9BE9B"/><rect x="10" y="5" width="12" height="5" fill="#9A5140"/><rect x="8" y="20" width="2" height="10" fill="#E0B66C"/></g>
<g id="w1"><use href="#p"/><rect x="8" y="39" width="6" height="4" fill="#4A3B32"/></g><g id="w2"><use href="#p" transform="translate(0 1)"/></g><g id="w3"><use href="#p"/><rect x="18" y="39" width="6" height="4" fill="#4A3B32"/></g><g id="w4"><use href="#p" transform="translate(0 -1)"/></g>
</defs>
<g id="row"><use href="#p"/><use href="#w1" x="32"/><use href="#w2" x="64"/><use href="#w3" x="96"/><use href="#w4" x="128"/></g>
<use href="#row" y="0"/><use href="#row" y="48"/><use href="#row" y="96"/><use href="#row" y="144"/><use href="#row" y="192"/><use href="#row" y="240"/><use href="#row" y="288"/><use href="#row" y="336"/>
<!-- Direction cues keep the 3/4 silhouette readable while sharing the stable body scale. -->
<rect x="13" y="11" width="6" height="2" fill="#24231F"/><rect x="45" y="59" width="2" height="2" fill="#24231F"/><rect x="115" y="107" width="2" height="2" fill="#24231F"/><rect x="147" y="155" width="2" height="2" fill="#24231F"/><rect x="12" y="203" width="2" height="2" fill="#24231F"/><rect x="18" y="203" width="2" height="2" fill="#24231F"/><rect x="44" y="251" width="2" height="2" fill="#24231F"/><rect x="108" y="299" width="2" height="2" fill="#24231F"/><rect x="140" y="347" width="2" height="2" fill="#24231F"/>
</svg>