<svg xmlns="http://www.w3.org/2000/svg" width="160" height="384" viewBox="0 0 160 384" shape-rendering="crispEdges">
<!-- Original Valdeniebla Brother Aldren atlas. 5 columns: idle + 4 walk frames. 8 rows: N,NE,E,SE,S,SW,W,NW. -->
<defs>
  <g id="shadow"><rect x="7" y="43" width="18" height="3" fill="#30312D" opacity="0.55"/></g>
  <g id="body">
    <use href="#shadow"/>
    <rect x="11" y="34" width="4" height="9" fill="#2B2925"/>
    <rect x="17" y="34" width="4" height="9" fill="#2B2925"/>
    <rect x="10" y="40" width="6" height="3" fill="#4A3B32"/>
    <rect x="16" y="40" width="6" height="3" fill="#4A3B32"/>
    <rect x="8" y="18" width="16" height="19" fill="#24231F"/>
    <rect x="9" y="18" width="14" height="18" fill="#4B443B"/>
    <rect x="10" y="20" width="12" height="15" fill="#5E5548"/>
    <rect x="9" y="27" width="14" height="3" fill="#3B332D"/>
    <rect x="11" y="27" width="2" height="3" fill="#A77B45"/>
    <rect x="18" y="28" width="3" height="5" fill="#715845"/>
    <rect x="7" y="20" width="3" height="11" fill="#4A3B32"/>
    <rect x="22" y="20" width="3" height="11" fill="#4A3B32"/>
    <rect x="7" y="29" width="3" height="3" fill="#C9BE9B"/>
    <rect x="22" y="29" width="3" height="3" fill="#C9BE9B"/>
    <rect x="9" y="7" width="14" height="12" fill="#24231F"/>
    <rect x="10" y="8" width="12" height="10" fill="#B8AA8B"/>
    <rect x="11" y="9" width="10" height="8" fill="#C9BE9B"/>
    <rect x="8" y="5" width="16" height="6" fill="#24231F"/>
    <rect x="9" y="5" width="14" height="5" fill="#563E36"/>
    <rect x="10" y="4" width="12" height="3" fill="#715845"/>
    <rect x="12" y="13" width="8" height="2" fill="#6D5947"/>
    <rect x="14" y="16" width="4" height="2" fill="#8C755D"/>
    <rect x="11" y="18" width="2" height="9" fill="#8A9290"/>
    <rect x="20" y="18" width="2" height="8" fill="#344536"/>
    <rect x="20" y="24" width="4" height="8" fill="#715845"/>
    <rect x="21" y="25" width="2" height="2" fill="#E0B66C"/>
  </g>
  <g id="face_front">
    <rect x="12" y="11" width="2" height="2" fill="#24231F"/>
    <rect x="18" y="11" width="2" height="2" fill="#24231F"/>
    <rect x="15" y="13" width="2" height="1" fill="#9A5140"/>
  </g>
  <g id="face_left"><rect x="11" y="11" width="2" height="2" fill="#24231F"/><rect x="15" y="11" width="2" height="2" fill="#24231F"/></g>
  <g id="face_right"><rect x="15" y="11" width="2" height="2" fill="#24231F"/><rect x="19" y="11" width="2" height="2" fill="#24231F"/></g>
  <g id="back"><rect x="12" y="8" width="8" height="8" fill="#715845"/><rect x="13" y="9" width="6" height="7" fill="#563E36"/><rect x="11" y="19" width="10" height="4" fill="#3B332D"/></g>
  <g id="walk1"><use href="#body"/><rect x="9" y="38" width="7" height="3" fill="#2B2925"/><rect x="19" y="35" width="3" height="5" fill="#2B2925"/></g>
  <g id="walk2"><use href="#body" transform="translate(0 1)"/><rect x="10" y="36" width="4" height="5" fill="#2B2925"/><rect x="18" y="36" width="4" height="5" fill="#2B2925"/></g>
  <g id="walk3"><use href="#body"/><rect x="10" y="35" width="3" height="5" fill="#2B2925"/><rect x="16" y="38" width="7" height="3" fill="#2B2925"/></g>
  <g id="walk4"><use href="#body" transform="translate(0 -1)"/><rect x="10" y="36" width="4" height="5" fill="#2B2925"/><rect x="18" y="36" width="4" height="5" fill="#2B2925"/></g>
  <g id="row_front"><use href="#body"/><use href="#face_front"/><use href="#walk1" x="32"/><use href="#face_front" x="32"/><use href="#walk2" x="64"/><use href="#face_front" x="64"/><use href="#walk3" x="96"/><use href="#face_front" x="96"/><use href="#walk4" x="128"/><use href="#face_front" x="128"/></g>
  <g id="row_left"><use href="#body"/><use href="#face_left"/><rect x="8" y="20" width="2" height="9" fill="#E0B66C"/><use href="#walk1" x="32"/><use href="#face_left" x="32"/><use href="#walk2" x="64"/><use href="#face_left" x="64"/><use href="#walk3" x="96"/><use href="#face_left" x="96"/><use href="#walk4" x="128"/><use href="#face_left" x="128"/></g>
  <g id="row_right"><use href="#body"/><use href="#face_right"/><rect x="22" y="20" width="2" height="9" fill="#E0B66C"/><use href="#walk1" x="32"/><use href="#face_right" x="32"/><use href="#walk2" x="64"/><use href="#face_right" x="64"/><use href="#walk3" x="96"/><use href="#face_right" x="96"/><use href="#walk4" x="128"/><use href="#face_right" x="128"/></g>
  <g id="row_back"><use href="#body"/><use href="#back"/><use href="#walk1" x="32"/><use href="#back" x="32"/><use href="#walk2" x="64"/><use href="#back" x="64"/><use href="#walk3" x="96"/><use href="#back" x="96"/><use href="#walk4" x="128"/><use href="#back" x="128"/></g>
</defs>
<use href="#row_back" y="0"/>
<use href="#row_right" y="48"/>
<use href="#row_right" y="96"/>
<use href="#row_front" y="144"/>
<use href="#row_front" y="192"/>
<use href="#row_left" y="240"/>
<use href="#row_left" y="288"/>
<use href="#row_back" y="336"/>
</svg>
